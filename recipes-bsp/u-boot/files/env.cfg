#general
arch=arm
baudrate=1500000
board=rock5a-rk3588s
board_name=rock5a-rk3588s
bootdelay=2
cpu=armv8
soc=rk3588
stderr=serial,vidconsole
stdout=serial,vidconsole
vendor=radxa

#boot env
loadaddr=0xc00800
fdt_addr_r=0x08300000
fdt_name=rk3588s-rock-5a.dtb
kernel_addr_r=0x09000000
kernel_name=/boot/Image
mmc_dev=0
config_part=3
rootfs_part=4

#boot commands
bootcmd=\
    run get_configs; \
    run mmcload; \
    booti ${kernel_addr_r} - ${fdt_addr_r}; \
    if test $? != 0; then \
        echo "[-] Nothing to boot..."; \
    fi;

mmcload=\
    load mmc ${mmc_dev}:${config_part} ${fdt_addr_r} ${fdt_name}; \
    load mmc ${mmc_dev}:${rootfs_part} ${kernel_addr_r} ${kernel_name};

bootargs=root=PARTUUID=e9852d44-6984-472c-8845-9ad2ba36bfd2 console=ttyFIQ0 rw rootwait coherent_pool=2M irqchip.gicv3_pseudo_nmi=0

#config file
get_configs=\
    load mmc ${mmc_dev}:${config_part} ${loadaddr} configs.txt; \
    if test $? = 0; then \
        env import -t ${loadaddr} ${filesize}; \
        if test $? = 0; then \
            echo "[+] Loading configs...OK"; \
        else \
            echo "[-] Loading configs...NOK"; \
        fi; \
    fi;

#write bootloaders
uboot_addr=0x4000
uboot_name=u-boot.itb
idbloader_addr=0x40
idbloader_name=idbloader.img
write_uboot=wget ${loadaddr} ${serverip}:/${uboot_name}; if test $? = 0; then mmc write ${loadaddr} ${uboot_addr} 0x2001; fi;
write_idbloader=wget ${loadaddr} ${serverip}:/${idbloader_name}; if test $? = 0; then mmc write ${loadaddr} ${idbloader_addr} 0x201; fi;

#write wic
wic_name=radxa-rock-image-rock-5a.wic
write_wic=wget ${loadaddr} ${serverip}:/${wic_name}; if test $? = 0; then setexpr sz ${filesize} / 0x200; setexpr sz ${sz} + 1; mmc write ${loadaddr} 0x0 ${sz}; fi

#network
ipaddr=192.168.0.20
serverip=192.168.0.1
netmask=255.255.255.0
httpdstp=8000